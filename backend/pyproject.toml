# ---------------------------------------------------------------------------
# ApexScan backend — Python project & tooling configuration.
# ---------------------------------------------------------------------------
[project]
name = "apexscan-backend"
version = "0.1.0"
description = "ApexScan trading scanner platform — backend API"
requires-python = ">=3.13"
readme = "README.md"

# Runtime dependencies. Versions are pinned to current stable majors and
# should be refreshed with `pip list --outdated` before each release.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "python-json-logger>=3.2",
    "httpx>=0.28",
    "pyotp>=2.10,<3",
    "websockets>=17,<18",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.setuptools.package-data]
"app.market_engine.calendar_data" = ["*.json"]

[project.optional-dependencies]
# Developer tooling: tests, linting, typing.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "pip-audit>=2.9,<3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Enable common rule families; keep the build warning-free.
# C90 (mccabe) enforces the cyclomatic-complexity ceiling from docs/11 Rule 16;
# D (pydocstyle, google) enforces the docstring standard from docs/11 Rule 26.
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "C90", "D"]
# docs/11 Rule 26 requires docstrings on non-trivial *public APIs* using Google
# style, which documents construction via the class docstring — so __init__
# (D107) and magic methods (D105) are not separately required.
ignore = ["D105", "D107"]

[tool.ruff.lint.mccabe]
# docs/11 §3.2 / Rule 16: cyclomatic complexity <= 8.
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstrings (D) and the complexity ceiling (C90) are production public-API
# standards (docs/11 Rules 16, 26). Tests are neither a public-API surface nor
# the target of the Market Engine complexity gate, so they are exempt.
"tests/**" = ["D", "C90"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires real PostgreSQL and Redis with APEXSCAN_RUN_INTEGRATION=1",
    "live_dhan: requires explicit Dhan credentials and APEXSCAN_DHAN_LIVE_SMOKE=1",
]
