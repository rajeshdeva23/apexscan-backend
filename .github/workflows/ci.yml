name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality and security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type-check
        run: python -m mypy app

      - name: Test
        run: python -m pytest

      - name: Audit Python dependencies
        run: python -m pip_audit

  frontend:
    name: Frontend quality and security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

  infrastructure:
    name: Compose runtime validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare CI environment
        run: cp .env.example .env

      - name: Pull service images
        run: docker compose pull postgres redis

      - name: Build application images
        run: docker compose build backend frontend

      - name: Start and verify PostgreSQL and Redis
        run: |
          docker compose up -d postgres redis
          for attempt in {1..30}; do
            postgres_status="$(docker inspect --format '{{.State.Health.Status}}' apexscan-postgres 2>/dev/null || true)"
            redis_status="$(docker inspect --format '{{.State.Health.Status}}' apexscan-redis 2>/dev/null || true)"
            if [[ "$postgres_status" == "healthy" && "$redis_status" == "healthy" ]]; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color postgres redis
          exit 1

      - name: Run database migrations
        run: docker compose run --rm backend alembic upgrade head

      - name: Start backend and frontend
        run: docker compose up -d backend frontend

      - name: Verify backend health
        run: |
          for attempt in {1..30}; do
            response="$(curl --fail --silent --show-error http://localhost:8000/api/v1/health 2>/dev/null || true)"
            if [[ "$response" == '{"status":"ok"}' ]]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color backend
          exit 1

      - name: Show startup logs
        if: always()
        run: docker compose logs --no-color postgres redis backend frontend

      - name: Shut down stack cleanly
        if: always()
        run: |
          docker compose down
          test -z "$(docker compose ps --status running --services)"
