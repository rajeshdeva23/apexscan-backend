name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality and security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type-check
        run: python -m mypy app

      - name: Test
        run: python -m pytest

      - name: Audit Python dependencies
        run: python -m pip_audit

  infrastructure:
    name: Compose runtime validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install integration-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"

      - name: Prepare CI environment
        run: cp .env.example .env

      - name: Pull service images
        run: docker compose pull postgres redis

      - name: Build backend image
        run: docker compose build backend

      - name: Start and verify PostgreSQL and Redis
        run: |
          docker compose up -d postgres redis
          for attempt in {1..30}; do
            postgres_status="$(docker inspect --format '{{.State.Health.Status}}' apexscan-postgres 2>/dev/null || true)"
            redis_status="$(docker inspect --format '{{.State.Health.Status}}' apexscan-redis 2>/dev/null || true)"
            if [[ "$postgres_status" == "healthy" && "$redis_status" == "healthy" ]]; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color postgres redis
          exit 1

      - name: Run real dependency lifecycle tests
        env:
          APEXSCAN_RUN_INTEGRATION: "1"
          INTEGRATION_DATABASE_URL: postgresql+asyncpg://apexscan:change_me_in_local_env@127.0.0.1:5432/apexscan
          INTEGRATION_REDIS_URL: redis://127.0.0.1:6379/0
        run: python -m pytest backend/tests/integration -m integration -v

      - name: Run database migrations
        run: docker compose run --rm backend alembic upgrade head

      - name: Start backend
        run: docker compose up -d backend

      - name: Run Phase 2 Compose runtime acceptance
        run: bash scripts/validate_phase2_runtime.sh

      - name: Show startup logs
        if: always()
        run: docker compose logs --no-color postgres redis backend

      - name: Shut down stack cleanly
        if: always()
        run: |
          docker compose down
          test -z "$(docker compose ps --status running --services)"
