name: Publish legacy rollback image

# One-time (DEPLOY-3C-R3A): publish the EXACT preserved current production backend
# image (docker save'd on the host) to GHCR as the immutable first-deploy rollback
# artifact. It fetches the archive from production over the hardened deploy SSH,
# verifies its SHA-256, loads it, tags it under the fixed apexscan-backend repo,
# and pushes with GITHUB_TOKEN (packages: write) — never a PAT, never a rebuild.
# It does NOT deploy, restart, or touch the running backend.

on:
  workflow_dispatch:
    inputs:
      archive_sha256:
        description: SHA-256 of the docker-save archive recorded on the host.
        required: true
        type: string
      expected_image_id:
        description: Exact preserved image id (sha256:<64hex>) to verify after load.
        required: true
        type: string
      remote_archive_path:
        description: Path to the archive on the production host.
        required: true
        default: /tmp/apexscan-legacy.tar
        type: string
      publish_tag:
        description: Publication handle tag (navigation only; digest is authority).
        required: true
        default: legacy-pre-sha-deploy-7713bdb
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: apexscan-publish-legacy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/apexscan-backend

jobs:
  publish:
    name: Fetch, load, and publish the preserved legacy image
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
      EXPECTED_IMAGE_ID: ${{ inputs.expected_image_id }}
      REMOTE_ARCHIVE_PATH: ${{ inputs.remote_archive_path }}
      PUBLISH_TAG: ${{ inputs.publish_tag }}
    steps:
      - name: Validate inputs
        run: |
          echo "$ARCHIVE_SHA256" | grep -Eq '^[0-9a-f]{64}$' || { echo "bad archive_sha256" >&2; exit 1; }
          echo "$EXPECTED_IMAGE_ID" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "bad expected_image_id" >&2; exit 1; }
          echo "$PUBLISH_TAG" | grep -Eq '^[A-Za-z0-9._-]+$' || { echo "bad publish_tag" >&2; exit 1; }
          case "$REMOTE_ARCHIVE_PATH" in /*) : ;; *) echo "archive path must be absolute" >&2; exit 1 ;; esac
          case "$REMOTE_ARCHIVE_PATH" in *..*) echo "archive path traversal" >&2; exit 1 ;; esac

      - name: Set up pinned SSH material (never echoed)
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/prod_known_hosts
          chmod 600 ~/.ssh/prod_known_hosts

      - name: Fetch preserved archive over hardened SSH
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/prod_known_hosts" -i "$HOME/.ssh/prod_key" \
            "${SSH_USER}@${SSH_HOST}:${REMOTE_ARCHIVE_PATH}" ./legacy.tar

      - name: Verify archive integrity
        run: |
          echo "${ARCHIVE_SHA256}  ./legacy.tar" | sha256sum -c -

      - name: Load preserved image
        run: |
          # Integrity is anchored by the archive SHA-256 (verified above): the loaded
          # image is exactly the preserved bytes/layers. The local image id can differ
          # across Docker engines (schema2/OCI config-encoding) and is NOT an identity
          # match — see EXPECTED_IMAGE_ID (the host running-image id) which is recorded
          # as rollback provenance, not compared here.
          out="$(docker load -i ./legacy.tar)"
          echo "$out"
          ref="$(printf '%s\n' "$out" | sed -n 's/^Loaded image: //p' | head -1)"
          [ -n "$ref" ] || ref="$(printf '%s\n' "$out" | sed -n 's/^Loaded image ID: //p' | head -1)"
          [ -n "$ref" ] || { echo "could not determine loaded image ref" >&2; exit 1; }
          echo "LOADED_REF=$ref" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push the preserved image
        run: |
          docker tag "$LOADED_REF" "${IMAGE_NAME}:${PUBLISH_TAG}"
          docker push "${IMAGE_NAME}:${PUBLISH_TAG}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE_NAME}:${PUBLISH_TAG}")"
          echo "LEGACY ROLLBACK DIGEST: ${digest}"
          echo "legacy_digest=${digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove transferred archive
        if: always()
        run: rm -f ./legacy.tar
