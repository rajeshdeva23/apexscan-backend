name: Deploy backend to production

# STAGE B (DEPLOY-1): manual, SHA-pinned promotion of an already-built immutable
# artifact to production. There is NO automatic production deploy: this runs only
# via workflow_dispatch and the 'production' protected environment requires human
# approval. It consumes a prebuilt image by digest (never builds from source),
# fails closed at every gate, and — because a backend restart re-authenticates
# Dhan — requires explicit operator confirmation of Dhan restart safety.
#
# In DEPLOY-1 no production transport is provisioned, so the promote job stops at
# the transport preflight with PRODUCTION_TRANSPORT_NOT_CONFIGURED. Host/user/key
# details are referenced by secret name only and are never fabricated here.

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-char commit SHA to promote (must be on main, CI green).
        required: true
        type: string
      dhan_restart_safety_confirmed:
        description: Confirm a backend restart will not trip the Dhan token rate-limit hazard.
        required: true
        default: false
        type: boolean
      deploy_reason:
        description: Short reason for this promotion (audit).
        required: false
        type: string

permissions:
  contents: read
  packages: read

# Only one production promotion at a time; never cancel an in-flight deploy.
concurrency:
  group: apexscan-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/apexscan-backend

jobs:
  authorize:
    name: Verify promotion eligibility
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch main for ancestry check
        run: git fetch --no-tags origin main

      - name: Verify SHA eligibility (reachable from main + CI green)
        working-directory: backend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env, never interpolated into the shell, to avoid script injection.
          TARGET_SHA: ${{ inputs.target_sha }}
          REPO: ${{ github.repository }}
        run: python -m deploy.eligibility --sha "$TARGET_SHA" --repo "$REPO"

      - name: Confirm Dhan restart safety
        if: ${{ inputs.dhan_restart_safety_confirmed != true }}
        run: |
          echo "DHAN_RESTART_SAFETY_NOT_CONFIRMED: promotion restarts the backend," \
               "which re-authenticates Dhan. Re-run with the confirmation checked only" \
               "after verifying the Dhan token rate-limit hazard is mitigated." >&2
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image digest
        id: digest
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          ref="${IMAGE_NAME}:${TARGET_SHA}"
          if ! digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            echo "ARTIFACT_NOT_FOUND: no published image for ${ref}. Build Stage A first." >&2
            exit 1
          fi
          echo "image=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${ref} -> ${IMAGE_NAME}@${digest}"

  promote:
    name: Promote to production
    needs: authorize
    runs-on: ubuntu-latest
    environment: production
    env:
      APEXSCAN_IMAGE: ${{ needs.authorize.outputs.image }}
      # Referenced by name only; unset until an operator provisions them.
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      PUBLIC_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deploy dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."

      - name: Transport preflight (fail closed if unprovisioned)
        run: |
          missing=()
          [ -n "$SSH_HOST" ] || missing+=("PRODUCTION_SSH_HOST")
          [ -n "$SSH_USER" ] || missing+=("PRODUCTION_SSH_USER")
          [ -n "$SSH_KEY" ] || missing+=("PRODUCTION_SSH_KEY")
          [ -n "$SSH_KNOWN_HOSTS" ] || missing+=("PRODUCTION_SSH_KNOWN_HOSTS")
          [ -n "$DEPLOY_PATH" ] || missing+=("PRODUCTION_DEPLOY_PATH")
          [ -n "$PUBLIC_BASE_URL" ] || missing+=("PRODUCTION_BASE_URL")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "PRODUCTION_TRANSPORT_NOT_CONFIGURED: missing ${missing[*]}." >&2
            echo "Transport is implemented (deploy.transport) but not provisioned; supply" >&2
            echo "these production environment secrets before a real promotion." >&2
            exit 1
          fi
          echo "Promoting ${APEXSCAN_IMAGE}"

      - name: Set up pinned SSH material (never echoed)
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/prod_known_hosts
          chmod 600 ~/.ssh/prod_known_hosts

      # Runs the full transport: remote preflight, immutable rollback-target
      # capture, digest pull, backend-only update, bounded health/version
      # verification, and immutable rollback on failure. Dhan restart safety was
      # already confirmed in the authorize job, so it is asserted here.
      - name: Promote over SSH transport
        working-directory: backend
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python -m deploy.transport \
            --host "$SSH_HOST" --user "$SSH_USER" \
            --key-file "$HOME/.ssh/prod_key" \
            --known-hosts "$HOME/.ssh/prod_known_hosts" \
            --image "$APEXSCAN_IMAGE" --target-sha "$TARGET_SHA" \
            --deploy-path "$DEPLOY_PATH" --base-url "$PUBLIC_BASE_URL" \
            --dhan-restart-safe --run-id "$RUN_ID"

      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/prod_key ~/.ssh/prod_known_hosts
