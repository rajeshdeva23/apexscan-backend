# ---------------------------------------------------------------------------
# ApexScan — Nginx reverse proxy (prepared, not yet enabled in compose).
#
# Terminates client traffic and routes:
#   /api  → backend (FastAPI)
#   /ws   → backend WebSocket endpoint
#   /     → frontend (static build / dev server)
#
# This is host-level deployment routing. It is not started by the backend's
# local Docker Compose stack; apply it only in a deployment that supplies both
# independently built frontend and backend services (ADR-002).
# ---------------------------------------------------------------------------
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:5173;
    }

    server {
        listen 80;
        server_name _;

        # REST API.
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket real-time channel (upgrade headers required).
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Frontend application.
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
